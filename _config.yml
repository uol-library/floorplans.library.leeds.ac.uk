# Base config, used on its own by GitHub Pages for
# https://uol-library.github.io/floorplans.library.leeds.ac.uk/ (served from a subpath).
# The production (public/) and development (public-dev/) sites layer their own
# overrides over this file - see _config_prod.yml and _config-dev.yml - so settings
# shared by all the sites only need changing here
title: University of Leeds Library Floor Plans
email: p.l.edwards@leeds.ac.uk
description: >-
  The University of Leeds Library Floor Plans are
  an application using the Leaflet mapping library
  to enable indoor wayfinding in the University's
  library spaces.
environment: production
url: "https://uol-library.github.io"
baseurl: "/floorplans.library.leeds.ac.uk"
host: "localhost"
version: "0.9"
google_analytics: ""
photo_dir: "/assets/photos/"
lang: "en"
dc:
  creator: "University of Leeds"
  dateCreated: "2022-06-06"
  dateModified: "2025-10-31"
  publisher: "University of Leeds"
  spatialCoverage: "University of Leeds campus"
  types:
    - "InteractiveResource"
  subjects:
    - "Digital mapping"
    - "College Campuses"
sass:
  style: compressed
exclude:
  - package*
  - Gemfile*
  - README.md
  - CHANGELOG.md
  - LICENSE
  - NOTICE
  - index.js
  - public
  - public-dev
  - node_modules
  - tests
  - sync.sh
  - vendor
